<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incident Logged — Emergency — Oxford Guardians Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/app.css" />
    <script src="assets/db.js"></script>
  <style>
      .topbar {
        background: #ffffff;
        border-bottom: 1px solid #d5dce8;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        gap: 24px;
      }
      .topbar-brand {
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 1.4rem;
        color: #0f2340;
        white-space: nowrap;
        text-decoration: none;
      }
      .chrome-nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chrome-nav a {
        display: inline-flex;
        align-items: center;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid #d5dce8;
        background: #ffffff;
        color: #0f2340;
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .chrome-nav a:hover {
        background: #dce8f4;
      }
      .shell {
        height: calc(100vh - 61px);
        min-height: 0;
        transition: grid-template-columns 0.3s ease;
      }
      .shell.sidebar-shrunk {
        grid-template-columns: 180px 1fr;
      }
      .shell.sidebar-shrunk .nav-link, 
      .shell.sidebar-shrunk .nav-link-sub { 
        font-size: 0.82rem !important; 
        padding-left: 8px !important; 
      }
      .shell.sidebar-shrunk .nav-link-sub { 
        padding-left: 20px !important; 
      }
      .shell.sidebar-shrunk .brand strong { 
        font-size: 1rem; 
      }
      .sidebar {
        height: 100%;
        overflow-y: auto;
      }
      .main {
        height: 100%;
        overflow-y: auto;
      }
    </style>
    <script>
      // Sidebar shrink effect
      const mainEl = document.querySelector(".main");
      const shellEl = document.querySelector(".shell");
      if (mainEl && shellEl) {
        mainEl.addEventListener("scroll", () => {
          if (mainEl.scrollTop > 20) {
            shellEl.classList.add("sidebar-shrunk");
          } else {
            shellEl.classList.remove("sidebar-shrunk");
          }
        });
      }
    </script>
  </head>
  <body>
    <!-- Topbar -->
      <div class="topbar">
        <a class="topbar-brand" href="admin-dashboard.html">Oxford Guardians</a>
        <nav class="chrome-nav">
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="notifications.html">Notifications</a>
        </nav>
      </div>
        <div class="shell">
          <section class="main" style="max-width:680px;margin:0 auto;">
            <div class="alert-box" style="background:var(--green-bg);border-color:var(--green);">
              <h3 style="color:var(--green);">Incident recorded</h3>
              <p id="success-subtitle">The emergency incident has been logged.</p>
            </div>
            <div class="card">
              <h4>What was recorded</h4>
              <div class="list" id="recorded-details">
                <div class="list-item"><small>Loading…</small></div>
              </div>
            </div>
            <div class="action-row">
              <a class="button" href="emergency-procedures.html">Back to emergency</a>
              <a class="button-alt" href="incident-logs.html">View all incidents</a>
            </div>
          </section>
        </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var incidentId = params.get('id');
        if (!incidentId) return;

        var inc = OG_DB.getIncidentById(incidentId);
        if (!inc) return;

        document.getElementById('success-subtitle').textContent =
          'The emergency incident for ' + (inc.studentName || 'unknown student') + ' has been logged with full details.';

        var details = [
          { label: 'Reference', value: inc.id },
          { label: 'Type', value: inc.type + ' — ' + inc.severity },
          { label: 'Student', value: inc.studentName || '—' },
          { label: 'Date/time', value: inc.dateTime ? new Date(inc.dateTime).toLocaleString('en-GB') : '—' },
          { label: 'Reported by', value: inc.reportedBy || '—' },
          { label: 'Response time', value: inc.responseTime || '—' },
          { label: 'Status', value: inc.status || '—' },
          { label: 'Host involved', value: inc.hostName || '—' },
          { label: 'Driver involved', value: inc.driverName || '—' },
          { label: 'External actors', value: inc.externalActors || '—' }
        ];

        var container = document.getElementById('recorded-details');
        container.innerHTML = '';
        details.forEach(function (d) {
          var div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = '<strong>' + d.label + '</strong><small>' + d.value + '</small>';
          container.appendChild(div);
        });
      })();
    
      // Sidebar shrink effect
      const mainEl = document.querySelector(".main");
      const shellEl = document.querySelector(".shell");
      if (mainEl && shellEl) {
        mainEl.addEventListener("scroll", () => {
          if (mainEl.scrollTop > 20) {
            shellEl.classList.add("sidebar-shrunk");
          } else {
            shellEl.classList.remove("sidebar-shrunk");
          }
        });
      }
    </script>
  </body>
</html>
